stages:
  - documentation

pages:
  stage: documentation
  tags:
    - ci.inria.fr
  image : registry.gitlab.inria.fr/croco-ocean/croco_docker/sphinx_pdf:2.0.0
  before_script:
    - |
      set -e

      echo "Fetching all git branches..."
      git fetch --all --prune

      echo "Detecting latest release branch..."
      # IMPORTANT: search in remote refs, not local heads
      latest_release_branch=$(
        git for-each-ref \
          --sort=-committerdate \
          --format='%(refname:short)' \
          "refs/remotes/origin/release-*" \
        | head -n 1
      )
      # Strip origin/ prefix so branch name becomes release-vX.Y.Z
      latest_release_branch=${latest_release_branch#origin/}
      echo "Latest release branch = $latest_release_branch"

      export latest_release_branch

  script:
    - |
      echo "Current branch = $CI_COMMIT_REF_NAME"
      echo "Latest release branch = $latest_release_branch"
      if [ "$CI_COMMIT_REF_NAME" = "$latest_release_branch" ]; then
        echo "Building release docs directly under /public"
        sphinx-build -b html Doc public
      else
        echo "Fetching published release docs from $latest_release_branch"
        curl --verbose --location --output artifacts.zip \
          --header "JOB-TOKEN:$CI_JOB_TOKEN" \
          "https://gitlab.inria.fr/api/v4/projects/$CI_PROJECT_ID/jobs/artifacts/$latest_release_branch/download?job=pages"

        # unzip last build
        unzip artifacts.zip

        echo "Building dev docs under /public/dev"
        sphinx-build -b html Doc public/dev
      fi
  artifacts:
    paths:
      - public
    when: always
    expire_in: 1 day

